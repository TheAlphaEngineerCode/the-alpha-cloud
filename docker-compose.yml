services:
  postgres:
    image: postgres:17-alpine
    container_name: cloud-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud}
      POSTGRES_DB: ${POSTGRES_DB:-cloud}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cloud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloud} -d ${POSTGRES_DB:-cloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cloud-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - cloud-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: cloud-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cloud-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: cloud-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"

volumes:
  cloud-postgres:
  cloud-redis:
  cloud-minio: