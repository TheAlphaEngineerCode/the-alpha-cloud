version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint*']
      test:
        patterns: ['vitest*', '@vitest/*', 'happy-dom*', '@testing-library/*']
      next:
        patterns: ['next*', 'react*', 'react-dom*']
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: ['dependencies', 'ci']